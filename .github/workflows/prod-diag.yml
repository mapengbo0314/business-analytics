name: prod-diag
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Deployed app base URL (blank = auto-detect from Vercel's GitHub deployments)"
        default: ""
        required: false
      keyword:
        description: "Search keyword"
        default: "HVAC"
        required: false
      location:
        description: "Location"
        default: "Texas"
        required: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      deployments: read
      contents: read
    steps:
      - name: Recent deployments + find the app URL
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_URL: ${{ inputs.url }}
        run: |
          if [ -n "$INPUT_URL" ]; then echo "url=$INPUT_URL" >> "$GITHUB_OUTPUT"; exit 0; fi
          deps=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/deployments?per_page=8")
          echo "== recent deployments (newest first) =="
          echo "$deps" | jq -r '.[] | "\(.created_at)  sha=\(.sha[0:7])  env=\(.environment)  id=\(.id)"'
          url=""
          for id in $(echo "$deps" | jq -r '.[].id'); do
            st=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/deployments/$id/statuses?per_page=3")
            echo "-- statuses for deployment $id --"
            echo "$st" | jq -r '.[] | "\(.created_at)  state=\(.state)  url=\(.environment_url // "-")"'
            if [ -z "$url" ]; then
              url=$(echo "$st" | jq -r '[.[] | select(.state == "success" and .environment_url != null)][0].environment_url // empty')
            fi
          done
          echo "chosen url=$url"
          # Deployment-specific URLs sit behind Vercel's deployment protection
          # ("Redirecting..." to SSO). Derive the PUBLIC production aliases from
          # the deployment hostname (<project>-<hash>-<scope>.vercel.app) and
          # pick the first that actually serves our API.
          host=$(echo "$url" | sed 's#https://##; s#/.*##')
          # Deployment hosts are <project>-<9-char-hash>-<scope>.vercel.app
          proj=$(echo "$host" | sed -E 's#^(.+)-[a-z0-9]{9}-(.+)\.vercel\.app$#\1#')
          scope=$(echo "$host" | sed -E 's#^(.+)-[a-z0-9]{9}-(.+)\.vercel\.app$#\2#')
          echo "project=$proj scope=$scope"
          chosen=""
          for c in "https://$proj.vercel.app" "https://$proj-$scope.vercel.app" "https://$proj-git-main-$scope.vercel.app" "$url"; do
            body=$(curl -s -L --max-time 20 "$c/api/scan?meta=1" || true)
            echo "candidate $c -> ${body:0:120}"
            if echo "$body" | grep -q refreshHours; then chosen="$c"; break; fi
          done
          echo "public url=$chosen"
          echo "url=$chosen" >> "$GITHUB_OUTPUT"

      - name: Probe the DEPLOYED app's scan endpoints
        env:
          BASE: ${{ steps.find.outputs.url }}
          KW: ${{ inputs.keyword }}
          LOC: ${{ inputs.location }}
        run: |
          # Diagnostic only — never mark the commit red over reachability.
          if [ -z "$BASE" ]; then echo "NO PUBLIC APP URL FOUND — every URL is behind Vercel Deployment Protection (SSO). Disable it (Settings → Deployment Protection) or pass the public URL as the workflow input."; exit 0; fi
          echo "BASE=$BASE"
          echo "== meta (version tells us which commit is live) =="
          curl -s -L --max-time 30 "$BASE/api/scan?meta=1"; echo; echo
          for s in bizbuysell businessesforsale bizquest businessbroker synergybb sunbelt; do
            echo "===== $s ====="
            curl -s -L --max-time 90 "$BASE/api/scan?site=$s&keyword=$KW&location=$LOC&debug=1" | head -c 3500; echo; echo
          done
